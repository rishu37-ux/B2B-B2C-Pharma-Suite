<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Pharma Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="auth-firm" id="firmName">Pharma Suite</div>
        <div class="auth-sub">Distributor &amp; chemist portal</div>
      </div>
    </div>
    <section class="card auth-card">
      <div class="card-body">
        <h1 class="auth-title" id="title">Sign in</h1>
        <p class="small muted" id="lead">Distributor staff and registered chemists sign in here.</p>
        <form id="form" novalidate>
          <div class="field"><label for="username">Login ID (email or username)</label><input id="username" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <div class="field hidden" id="confirmWrap"><label for="confirm">Repeat password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"></div>
          <div class="auth-error" id="error" role="alert"></div>
          <button class="btn primary auth-btn" id="submit" type="submit">Sign in</button>
        </form>
      </div>
    </section>
    <p class="small muted auth-foot">Chemists: your login ID is the email you gave your distributor, and your first password is your mobile number.</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
