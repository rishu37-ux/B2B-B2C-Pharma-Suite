<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemist portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="portal-page">
  <header class="portal-top">
    <a class="brand brand-home portal-home" href="portal.html" title="Home — stock list">
      <div class="brand-mark" id="brandMark">P</div>
      <div class="brand-text">
        <div class="brand-name" id="firmName">Distributor</div>
        <div class="brand-sub">Chemist portal</div>
      </div>
    </a>
    <div class="spacer"></div>
    <div class="portal-who"><div class="strong" id="chemName"></div><div class="small" id="chemUser"></div></div>
    <button class="btn sm portal-out" id="pwBtn" type="button">Password</button>
    <button class="btn sm portal-out" id="logoutBtn" type="button">Sign out</button>
  </header>
  <nav class="portal-tabs" id="tabs">
    <button type="button" data-tab="stock" class="active">Stock &amp; order</button>
    <button type="button" data-tab="cart">Cart <span class="badge-n" id="cartN" hidden></span></button>
    <button type="button" data-tab="orders">My orders</button>
    <button type="button" data-tab="bills">My bills</button>
  </nav>
  <main class="content portal-content" id="content"><div class="empty">Loading…</div></main>

  <div class="modal-back" id="modalBack">
    <div class="modal sm" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="btn ghost sm" id="modalClose" type="button" aria-label="Close">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="portal.js"></script>
</body>
</html>
