<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharma Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand brand-home" href="#overview" data-nav="overview" title="Home — go to Overview">
        <div class="brand-mark" id="brandMark">P</div>
        <div class="brand-text">
          <div class="brand-name" id="brandName">Pharma Suite</div>
          <div class="brand-sub" id="brandSub">Pharma Suite</div>
        </div>
        <svg class="brand-home-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span id="storageNote">Data is saved in this browser.</span>
        <br><button id="settingsBtn" type="button">Settings &amp; backup</button>
        <span id="accountBtns" hidden><button id="pwBtn" type="button">Change password</button> <button id="logoutBtn" type="button">Sign out</button></span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="page-title" id="pageTitle">Overview</h1>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="spacer"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="globalSearch" placeholder="Search products, chemists, invoices…">
        </label>
        <button type="button" class="avatar" id="avatarBtn" title="Profile">PS</button>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="modal-back" id="modalBack">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="btn ghost sm" id="modalClose" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="datalists" hidden></div>

  <script src="hospitals-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
